<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    {% load static %}
    <link rel="stylesheet" href="{% static 'trading/styles.css' %}">
    <title>Create Account</title>
</head>
<body>
    <h1>Create Account</h1>
    <p>Create a simple account to use your own paper trading data.</p>

    <p class="site-nav">
        <a href="/">Home</a> |
        <a href="{% url 'login' %}">Log In</a>
    </p>

    {% if form.errors %}
        <p class="message message-error">Please fix the errors below and try again.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create Account</button>
    </form>
</body>
</html>
