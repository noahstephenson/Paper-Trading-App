<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    {% load static %}
    <link rel="stylesheet" href="{% static 'trading/styles.css' %}">
    <title>{% block title %}Paper Trading{% endblock %}</title>
</head>
<body>

{% block nav %}
<div class="site-nav">
    <a href="/">Home</a>
    <a href="/search/">Search</a>
    <a href="/trade/new/">New Trade</a>
    <a href="/trades/">Trade History</a>
    <a href="/portfolio/">Portfolio</a>
    <a href="/watchlist/">Watchlist</a>
    <span class="nav-user">
        <span class="nav-username">Signed in as: <strong>{{ request.user.username }}</strong></span>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Log Out</button>
        </form>
    </span>
</div>
{% endblock %}

{% block content %}{% endblock %}

</body>
</html>
